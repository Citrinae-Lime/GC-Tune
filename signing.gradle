// =========================================================================================
// 统一签名配置 / Shared Signing Configuration
// =========================================================================================

android {
    signingConfigs {
        release {
            def ks = rootProject.file(System.getenv("KEYSTORE_FILE") ?: "release.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            }
        }
    }
}
