// =========================================================================================
// 独立签名配置文件 / Signing Configuration
// =========================================================================================
// 说明：
// 此文件由主工程 app/build.gradle 通过 `apply from: 'signing.gradle'` 引入。
// 将原作者的签名配置独立抽离至此，方便在本地缺少原作者签名密钥库（poc.keystore）时，
// 直接在此处配置或替换为您自己的 release / debug 签名信息，而无需修改主构建脚本。
// =========================================================================================

android {
    signingConfigs {
        release {
            // 原作者提供的默认签名配置（本地不存在对应文件时请按需修改为您自己的签名文件路径）：
            storeFile file('../../poc_gcrce/poc.keystore')
            storePassword 'android'
            keyAlias 'gd'
            keyPassword 'android'
        }
    }
}
