plugins {
    id 'com.android.application'
}

// 统一引用根目录签名配置
apply from: rootProject.file('signing.gradle')

android {
    namespace 'com.poc.gctune.overlay.m3'
    compileSdk 35

    defaultConfig {
        applicationId 'com.poc.gctune.overlay.m3'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}
